<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <filter id="mobile-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b1" />
      <feMerge><feMergeNode in="b1" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="mob-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF00FF" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>
  </defs>
  <!-- Transparent Hexagonal Tech Shield -->
  <polygon points="64,8 116,36 116,92 64,120 12,92 12,36" 
           fill="none" stroke="#FF00FF" stroke-width="2" opacity="0.6" stroke-dasharray="6 4" />
  <polygon points="64,14 110,40 110,88 64,114 18,88 18,40" 
           fill="none" stroke="url(#mob-grad)" stroke-width="1.5" />
  
  <!-- Smartphone Frame & Gyro Crosshairs -->
  <g filter="url(#mobile-glow)">
    <rect x="46" y="32" width="36" height="60" rx="6" fill="none" stroke="#FF00FF" stroke-width="2" />
    <line x1="56" y1="38" x2="72" y2="38" stroke="#FF00FF" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="64" cy="84" r="2.5" fill="#FFFFFF" />
    
    <!-- Gyro Sensor Arcs -->
    <path d="M 34 50 A 18 18 0 0 0 34 74" fill="none" stroke="#00F3FF" stroke-width="2" stroke-linecap="round" />
    <path d="M 94 50 A 18 18 0 0 1 94 74" fill="none" stroke="#00F3FF" stroke-width="2" stroke-linecap="round" />
  </g>
  <text x="64" y="108" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#FF00FF" text-anchor="middle" letter-spacing="2">MOBILE F2P</text>
</svg>
