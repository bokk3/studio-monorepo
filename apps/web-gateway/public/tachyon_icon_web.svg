<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <filter id="web-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b1" />
      <feMerge><feMergeNode in="b1" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="web-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F3FF" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>
  </defs>
  <!-- Transparent Hexagonal Tech Shield -->
  <polygon points="64,8 116,36 116,92 64,120 12,92 12,36" 
           fill="none" stroke="#00F3FF" stroke-width="2" opacity="0.6" stroke-dasharray="6 4" />
  <polygon points="64,14 110,40 110,88 64,114 18,88 18,40" 
           fill="none" stroke="url(#web-grad)" stroke-width="1.5" />
  
  <!-- Web Globe & Network Orbits -->
  <g filter="url(#web-glow)">
    <circle cx="64" cy="64" r="30" fill="none" stroke="#00F3FF" stroke-width="2" />
    <ellipse cx="64" cy="64" rx="30" ry="12" fill="none" stroke="#00F3FF" stroke-width="1.5" opacity="0.8" />
    <line x1="64" y1="34" x2="64" y2="94" stroke="#00F3FF" stroke-width="1.5" opacity="0.8" />
    <line x1="34" y1="64" x2="94" y2="64" stroke="#00F3FF" stroke-width="1.5" opacity="0.8" />
    <!-- Center Lightning Node -->
    <polygon points="66,48 56,66 64,66 62,80 72,62 64,62" fill="#FFFFFF" />
  </g>
  <text x="64" y="108" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#00F3FF" text-anchor="middle" letter-spacing="2">WEB F2P</text>
</svg>
