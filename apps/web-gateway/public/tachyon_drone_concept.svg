<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <filter id="subtle-magenta-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b1" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="drone-hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D0A35" />
      <stop offset="50%" stop-color="#15051B" />
      <stop offset="100%" stop-color="#09010C" />
    </linearGradient>

    <linearGradient id="magenta-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FF00FF" />
      <stop offset="100%" stop-color="#9D00FF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="neon-coral-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#FF00FF" />
    </linearGradient>
  </defs>

  <!-- Group: Orbit Runner High-Speed Vertical Gyro Craft -->
  <g transform="translate(0, 30)">
    <!-- Gyro Kinetic Orbit Rings (Transparent Background) -->
    <ellipse cx="300" cy="270" rx="220" ry="85" fill="none" stroke="#9D00FF" stroke-width="1.5" stroke-dasharray="16 10" opacity="0.5" />
    <ellipse cx="300" cy="270" rx="180" ry="65" fill="none" stroke="#FF00FF" stroke-width="1.8" stroke-dasharray="24 14" opacity="0.6" />

    <!-- Vertical Thruster Exhaust Plume -->
    <polygon points="275,370 300,520 325,370" fill="url(#magenta-beam)" filter="url(#subtle-magenta-glow)" opacity="0.9" />

    <!-- Forward Swept Aerodynamic Blades (Left & Right) -->
    <polygon points="300,210 140,150 90,260 160,280 270,300" 
             fill="url(#drone-hull)" stroke="#FF00FF" stroke-width="2" stroke-linejoin="round" />
    <polyline points="140,150 90,260 160,280" fill="none" stroke="#FF3366" stroke-width="2.5" />

    <polygon points="300,210 460,150 510,260 440,280 330,300" 
             fill="url(#drone-hull)" stroke="#FF00FF" stroke-width="2" stroke-linejoin="round" />
    <polyline points="460,150 510,260 440,280" fill="none" stroke="#FF3366" stroke-width="2.5" />

    <!-- Central Gyro Fuselage (Diamond/Hexagon) -->
    <polygon points="300,80 345,190 340,360 300,385 260,360 255,190" 
             fill="url(#drone-hull)" stroke="#E2E8F0" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Central Glowing Gyroscopic Sensor Core -->
    <circle cx="300" cy="260" r="32" fill="#09010C" stroke="#FF00FF" stroke-width="2" />
    <circle cx="300" cy="260" r="22" fill="url(#neon-coral-ring)" filter="url(#subtle-magenta-glow)" />
    <circle cx="300" cy="260" r="8" fill="#FFFFFF" />

    <!-- Sensor Crosshair Reticle Overlays -->
    <line x1="300" y1="210" x2="300" y2="310" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" stroke-dasharray="6 4" />
    <line x1="250" y1="260" x2="350" y2="260" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" stroke-dasharray="6 4" />

    <!-- Forward Sensory Canopy Facet -->
    <polygon points="300,90 320,165 300,185 280,165" fill="#9D00FF" opacity="0.75" />
    <line x1="300" y1="90" x2="300" y2="185" stroke="#FFFFFF" stroke-width="1" />

    <!-- Telemetry Callouts -->
    <g font-family="'JetBrains Mono', monospace" font-size="10" fill="#E2E8F0">
      <circle cx="90" cy="260" r="3" fill="#FF00FF" />
      <line x1="90" y1="260" x2="40" y2="280" stroke="#FF00FF" stroke-width="0.8" />
      <text x="30" y="300" fill="#FF00FF">TARE_LOCK: 0.0°</text>

      <circle cx="510" cy="260" r="3" fill="#9D00FF" />
      <line x1="510" y1="260" x2="560" y2="280" stroke="#9D00FF" stroke-width="0.8" />
      <text x="460" y="300" fill="#9D00FF">GYRO: 120HZ</text>
    </g>
  </g>
</svg>
