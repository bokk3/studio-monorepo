<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="subtle-cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b1" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="sphere-base" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <linearGradient id="spin-curl-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#00F3FF" />
      <stop offset="100%" stop-color="#00FFB2" />
    </linearGradient>

    <linearGradient id="mint-ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFB2" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>
  </defs>

  <!-- Group: Astro-Smash Aerodynamic Magnus Core (100% Transparent Background) -->
  <g transform="translate(0, 0)">
    <!-- Aerodynamic Vorticity Wake Lines -->
    <path d="M 120 180 C 60 120, 40 240, 20 250" fill="none" stroke="#00F3FF" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4" />
    <path d="M 380 320 C 440 380, 460 260, 480 250" fill="none" stroke="#00FFB2" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4" />

    <!-- Exterior Dynamic Magnus Spin Ring -->
    <ellipse cx="250" cy="250" rx="210" ry="120" fill="none" stroke="url(#mint-ring)" stroke-width="2" stroke-dasharray="24 16 4 16" transform="rotate(-28 250 250)" opacity="0.8" />
    <circle cx="95" cy="170" r="4" fill="#00F3FF" filter="url(#subtle-cyan-glow)" />
    <circle cx="405" cy="330" r="4" fill="#00FFB2" filter="url(#subtle-cyan-glow)" />

    <!-- 3D Sphere Body -->
    <circle cx="250" cy="250" r="160" fill="url(#sphere-base)" stroke="#334155" stroke-width="2" />

    <!-- Geodesic Seam Grooves (Magnus Air Trapping) -->
    <!-- Equator Curve -->
    <path d="M 90 250 C 130 170, 370 170, 410 250 C 370 330, 130 330, 90 250 Z" 
          fill="none" stroke="#00F3FF" stroke-width="2.5" stroke-dasharray="14 6" filter="url(#subtle-cyan-glow)" />

    <!-- Cross Meridian Arcs -->
    <path d="M 250 90 C 170 130, 170 370, 250 410" fill="none" stroke="#00FFB2" stroke-width="2" opacity="0.75" />
    <path d="M 250 90 C 330 130, 330 370, 250 410" fill="none" stroke="#0055FF" stroke-width="2" opacity="0.75" />

    <!-- Central Fusion Core Contact Hub -->
    <circle cx="250" cy="250" r="28" fill="#020617" stroke="#00F3FF" stroke-width="2" />
    <polygon points="250,228 266,242 266,258 250,272 234,258 234,242" fill="url(#spin-curl-cyan)" />
    <circle cx="250" cy="250" r="6" fill="#FFFFFF" />

    <!-- Specular Highlight Curve -->
    <ellipse cx="200" cy="180" rx="40" ry="20" fill="#FFFFFF" opacity="0.15" transform="rotate(-30 200 180)" />

    <!-- Telemetry Callout -->
    <g font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">
      <text x="210" y="70" fill="#00F3FF">MAGNUS_LIFT: 0.8G</text>
      <text x="210" y="440" fill="#00FFB2">SPIN_RPM: 2800</text>
    </g>
  </g>
</svg>
