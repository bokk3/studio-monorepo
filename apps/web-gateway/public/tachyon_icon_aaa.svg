<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <filter id="aaa-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b1" />
      <feMerge><feMergeNode in="b1" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="aaa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#00F3FF" />
      <stop offset="100%" stop-color="#FF00FF" />
    </linearGradient>
  </defs>
  <!-- Transparent Hexagonal Tech Shield -->
  <polygon points="64,8 116,36 116,92 64,120 12,92 12,36" 
           fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" stroke-dasharray="6 4" />
  <polygon points="64,14 110,40 110,88 64,114 18,88 18,40" 
           fill="none" stroke="url(#aaa-grad)" stroke-width="1.5" />
  
  <!-- AAA Console Controller & Star Crown -->
  <g filter="url(#aaa-glow)">
    <path d="M 40 50 C 44 42, 84 42, 88 50 C 94 62, 92 78, 82 82 C 76 84, 72 76, 68 76 C 64 76, 60 76, 56 76 C 52 76, 48 84, 42 82 C 32 78, 30 62, 40 50 Z" 
          fill="none" stroke="#00F3FF" stroke-width="2" />
    <!-- D-pad -->
    <path d="M 46 58 L 52 58 M 49 55 L 49 61" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <!-- Buttons -->
    <circle cx="76" cy="56" r="1.5" fill="#FF00FF" />
    <circle cx="80" cy="60" r="1.5" fill="#00F3FF" />
    <circle cx="72" cy="60" r="1.5" fill="#FFFFFF" />
    <circle cx="76" cy="64" r="1.5" fill="#0055FF" />
    
    <!-- Top Crown Diamond (AAA Quality) -->
    <polygon points="64,30 70,38 64,44 58,38" fill="#FFFFFF" />
  </g>
  <text x="64" y="108" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">AAA PREM</text>
</svg>
