<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="neon-stream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F3FF" />
      <stop offset="50%" stop-color="#0055FF" />
      <stop offset="100%" stop-color="#FF00FF" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#E2F7FF" />
      <stop offset="100%" stop-color="#00F3FF" />
    </linearGradient>

    <linearGradient id="wing-grad-l" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F3FF" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>

    <linearGradient id="wing-grad-r" x1="100%" y1="0%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#FF00FF" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>
  </defs>

  <!-- Left Side: Tachyon Monogram Icon (Centered at X: 160, Y: 160) -->
  <g transform="translate(10, 0)">
    <!-- Circuit Arc -->
    <circle cx="150" cy="160" r="120" fill="none" stroke="#00F3FF" stroke-width="1.2" stroke-dasharray="14 10 3 10" opacity="0.4" />
    <circle cx="150" cy="160" r="95" fill="none" stroke="#FF00FF" stroke-width="1" stroke-dasharray="24 16" opacity="0.3" />
    
    <g filter="url(#logo-glow)">
      <!-- Left Wing -->
      <path d="M50 96 L140 96 L126 122 L76 122 L60 148 L32 148 Z" 
            fill="url(#wing-grad-l)" stroke="#00F3FF" stroke-width="1.5" stroke-linejoin="round" />
      
      <!-- Right Wing -->
      <path d="M250 96 L160 96 L174 122 L224 122 L240 148 L268 148 Z" 
            fill="url(#wing-grad-r)" stroke="#FF00FF" stroke-width="1.5" stroke-linejoin="round" />

      <!-- Crest -->
      <polygon points="150,72 185,98 150,114 115,98" 
               fill="#FFFFFF" stroke="#00F3FF" stroke-width="1.5" />

      <!-- Twin Stems -->
      <path d="M135 120 L146 120 L146 226 L132 258 L122 258 L135 214 Z" 
            fill="url(#neon-stream)" stroke="#00F3FF" stroke-width="1.2" />
      <path d="M165 120 L154 120 L154 226 L168 258 L178 258 L165 214 Z" 
            fill="url(#neon-stream)" stroke="#FF00FF" stroke-width="1.2" />

      <!-- Center Diamond -->
      <polygon points="150,136 166,164 150,192 134,164" fill="#FFFFFF" />
      <polygon points="150,142 161,164 150,186 139,164" fill="url(#neon-stream)" />

      <!-- Pulse Spike -->
      <line x1="150" y1="72" x2="150" y2="40" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <line x1="150" y1="200" x2="150" y2="280" stroke="#00F3FF" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6" />
    </g>
  </g>

  <!-- Right Side: TACHYON Typography & Subtitle (Completely Transparent Vector) -->
  <g transform="translate(320, 0)">
    <!-- Decorative Tech Horizon Lines -->
    <line x1="0" y1="72" x2="820" y2="72" stroke="url(#neon-stream)" stroke-width="1" opacity="0.3" stroke-dasharray="16 8 4 8" />
    <circle cx="820" cy="72" r="3" fill="#FF00FF" opacity="0.6" />

    <!-- TACHYON Logotype (Clean Vector Polygons/Paths for Universal Rendering) -->
    <g filter="url(#logo-glow)">
      <!-- T -->
      <path d="M10 92 L96 92 L96 116 L66 116 L66 220 L38 220 L38 116 L10 116 Z" fill="url(#text-grad)" />
      <!-- A -->
      <path d="M136 92 L168 92 L206 220 L176 220 L166 186 L138 186 L128 220 L98 220 Z M152 134 L143 164 L161 164 Z" fill="url(#text-grad)" />
      <!-- C -->
      <path d="M280 116 L280 92 C230 92 216 116 216 156 C216 196 230 220 280 220 L280 196 C250 196 244 184 244 156 C244 128 250 116 280 116 Z" fill="url(#text-grad)" />
      <!-- H -->
      <path d="M294 92 L322 92 L322 142 L368 142 L368 92 L396 92 L396 220 L368 220 L368 168 L322 168 L322 220 L294 220 Z" fill="url(#text-grad)" />
      <!-- Y -->
      <path d="M408 92 L438 92 L460 148 L482 92 L512 92 L474 170 L474 220 L446 220 L446 170 Z" fill="url(#text-grad)" />
      <!-- O -->
      <path d="M524 156 C524 116 540 92 588 92 C636 92 652 116 652 156 C652 196 636 220 588 220 C540 220 524 196 524 156 Z M552 156 C552 186 560 196 588 196 C616 196 624 186 624 156 C624 126 616 116 588 116 C560 116 552 126 552 156 Z" fill="url(#text-grad)" />
      <!-- N -->
      <path d="M666 92 L694 92 L744 172 L744 92 L772 92 L772 220 L744 220 L694 140 L694 220 L666 220 Z" fill="url(#text-grad)" />
    </g>

    <!-- Subtitle: INTERACTIVE // NEXT-GEN GAME ECOSYSTEM -->
    <g transform="translate(14, 252)">
      <text font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="7" fill="#00F3FF">
        INTERACTIVE
      </text>
      <text x="180" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400" letter-spacing="4" fill="#0055FF">
        //
      </text>
      <text x="210" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="4" fill="#B0C4DE">
        NEXT-GEN GAME ECOSYSTEM
      </text>
      
      <!-- Telemetry Nodes -->
      <circle cx="580" cy="-5" r="4" fill="#00F3FF" filter="url(#logo-glow)" />
      <circle cx="600" cy="-5" r="3" fill="#0055FF" />
      <circle cx="616" cy="-5" r="3" fill="#FF00FF" />
    </g>

    <!-- Bottom Tech Accent Bar -->
    <line x1="10" y1="274" x2="820" y2="274" stroke="url(#neon-stream)" stroke-width="2" opacity="0.75" />
    <line x1="10" y1="278" x2="160" y2="278" stroke="#00F3FF" stroke-width="1.5" />
    <line x1="720" y1="278" x2="820" y2="278" stroke="#FF00FF" stroke-width="1.5" />
  </g>
</svg>
